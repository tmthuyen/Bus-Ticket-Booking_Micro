  notification_api:
    build: ./BE/notify_service
    ports:
      - "8004:8000"
    volumes:
      - ./BE/notify_service:/app
    env_file:
      - ./BE/notify_service/.env
    depends_on:
      - notification_db

  notification_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: btb_notification_db
    ports:
      - "3315:3306"   
    volumes:
      - btb_notification_db_data:/var/lib/mysql

  payment_api:
    build: ./BE/payment_service
    ports:
      - "8005:8000"
    volumes:
