
services:
  gateway:
      build: ./BE/gateway 
      environment:
        - ROUTES={"\/users":"http://user_api:8000", "\/trips":"http://trip_api:8000", "\/bookings":"http://booking_api:8000", "\/payments":"http://payment_api:8000","\/notifications":"http://notification_api:8000"}
        - JWT_SECRET=thuyen_user              # trùng với user service
        - JWT_ALG=HS256
      ports:
        - "8000:8000"
      volumes:
        - ./BE/gateway:/app   
      depends_on:
        - user_api
        # - trip_api
        # - booking_api
        - payment_api
        - notification_api

  user_api:
    build: ./BE/user_service
    ports:
      - "8001:8000"
    volumes:
      - ./BE/user_service:/app
    env_file:
      - ./BE/user_service/.env
    depends_on:
      - user_db

  user_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: btb_user_db
    ports:
      - "3312:3306"   # expose port khác bên ngoài để tránh trùng
    volumes:
      - btb_user_db_data:/var/lib/mysql  
    
